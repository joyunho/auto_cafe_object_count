# GitHub Pages 배포: 저장소 Settings → Pages → Source를 "GitHub Actions"로 설정하면
# 기본 브랜치에 push할 때마다 https://<계정>.github.io/<저장소>/ 에 배포됩니다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect static files
        run: |
          mkdir -p dist
          cp -r index.html manifest.webmanifest sw.js src icons dist/
          # 배포마다 서비스 워커 버전을 바꿔 새 캐시가 설치되게 한다
          sed -i "s/const VERSION = '[^']*';/const VERSION = '${GITHUB_SHA::8}';/" dist/sw.js
          grep -q "${GITHUB_SHA::8}" dist/sw.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true # Pages가 아직 켜져 있지 않으면 켜기를 시도 (권한이 없으면 Settings → Pages에서 수동 설정)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
